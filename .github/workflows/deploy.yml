name: Build and deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Check project
        run: npm run check
      - name: Build site
        run: npm run build
        env:
          BLOG_SITE: ${{ steps.pages.outputs.origin }}
          BLOG_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
